{% extends "base.html" %}

{% block head %}
<style>
  blockquote { font-style: italic; }

  .services {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
    gap: 2rem;
    padding: 0;
    list-style: none;
    margin-bottom: var(--gap);
  }
  .service { padding: 1.5rem; border: 1px solid #e3e3e3; border-radius: 8px; }
  .service .heading { text-align: center; margin-bottom: 1rem; }
  .service__text p { margin: 0; color: #555; }
</style>
{% endblock head %}

{% block content %}
<h1 style="text-align: center">Services</h1>

<ul class="services">
  {% for p in section.pages %}
    <li class="service">
      <h3 class="heading">{{ p.title }}</h3>
      <div class="service__text">{{ p.content | safe }}</div>
    </li>
  {% endfor %}
</ul>

{{ section.content | markdown | safe }}

{% endblock %}
