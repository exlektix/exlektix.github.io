{% extends "base.html" %}

{% block head %}
<style type="text/css">
  .container { display: flex; justify-content: center; align-items: center; margin-top: 4rem; margin-left: 2rem; margin-right: 2rem; }
  figure {
    max-width: 800px;
    margin-bottom: 1rem;
    margin-top: 1rem;

    figcaption { text-align: center }
    img { margin-bottom: 0.5rem; max-width: 100%; display: block; }
  }
  .tagline { font-family: var(--font-heading); }
  .two-col {
    align-items: start;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(min(100%, 20rem), 1fr));
    gap: var(--gap);
    margin-inline: auto;
    max-width: 64rem;
  }
</style>
{% endblock %}

{% block content %}
  <div class="container">
    <div class="two-col">
      <div class="tagline" style="font-size: 2.5rem">{{ section.content | markdown(inline=true) | safe }}</div>
      <figure>
        <img src="{{ get_url(path=section.extra.img.src) }}" alt="{{ section.extra.img.alt }}" />
        <figcaption>{{ section.extra.img.creditAuthor}}, <a href="{{ section.extra.img.creditHref }}">{{ section.extra.img.creditTitle }}</figcaption>
      </figure>
    </div>
  </div>
{% endblock content %}
