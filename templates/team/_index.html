{% extends "base.html" %}
 
{% block content %}
  
<section class="two-col">
{% for p in section.pages %}
<figure>
  <img src="{{ get_url(path=section.extra.img.src) }}" alt="{{ section.extra.img.alt }}" />
  <figcaption>{{ p.content | safe }}</figcaption>
</figure>
{% endfor %}    
</section>
 
{% endblock %}
