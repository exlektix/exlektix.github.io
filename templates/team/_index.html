{% extends "base.html" %}

{% block head %}

<style type="text/css">
figure {
  max-width: 400px;
  margin-bottom: 1rem;
  margin-top: 1rem;

  h4 { text-align: center; }  
  .heading { margin-bottom: 0.5rem }
  img { margin-bottom: 1.5rem; max-height: 400px; max-width: 100%; display: block; }
}

.figures {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: var(--gap);
  align-items: start;
  margin-inline: auto;
  max-width: 64rem;
}
</style>

{% endblock %}

{% block content %}
<h1 style="text-align: center">Team</h1>
<div class="figures">
{% for p in section.pages %}
<figure>
  <h4 class="heading">{{ p.title }}</h4>
  <img src="{{ get_url(path=p.extra.img.src) }}" alt="{{ p.extra.img.alt }}" />
  <figcaption>{{ p.content | safe }}</figcaption>
</figure>
{% endfor %}    
</div>
 
{% endblock %}
